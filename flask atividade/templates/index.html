<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Amigos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤝 Gerenciador de Amigos</h1>
            <p>Organize e gerencie sua lista de amigos de forma simples e eficiente</p>
        </div>

        <div class="content">
            <!-- Seção de Adicionar Amigo -->
            <div class="section">
                <h2>➕ Adicionar Novo Amigo</h2>
                <div class="form-group">
                    <label for="nomeAmigo">Nome do Amigo:</label>
                    <input type="text" id="nomeAmigo" placeholder="Digite o nome do amigo...">
                </div>
                <button class="btn btn-primary" onclick="adicionarAmigo()">
                    Adicionar Amigo
                </button>
            </div>

            <!-- Seção de Busca -->
            <div class="section">
                <h2>🔍 Buscar Amigos</h2>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="buscarAmigo" placeholder="Digite o nome para buscar..." onkeyup="buscarAmigos()">
                </div>
            </div>

            <!-- Alertas -->
            <div id="alertContainer"></div>

            <!-- Seção de Lista de Amigos -->
            <div class="section">
                <h2>👥 Lista de Amigos</h2>
                <button class="btn btn-success" onclick="carregarAmigos()">
                    Atualizar Lista
                </button>
                <div id="listaAmigos" class="friends-grid">
                    <!-- Amigos serão carregados aqui -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edição -->
    <div id="modalEdicao" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <h2>✏️ Editar Amigo</h2>
            <div class="form-group">
                <label for="nomeEdicao">Nome:</label>
                <input type="text" id="nomeEdicao" placeholder="Digite o novo nome...">
            </div>
            <button class="btn btn-primary" onclick="salvarEdicao()">
                Salvar Alterações
            </button>
            <button class="btn btn-warning" onclick="fecharModal()">
                Cancelar
            </button>
        </div>
    </div>

    <script src="static/js/script.js"></script>
</body>
</html>
